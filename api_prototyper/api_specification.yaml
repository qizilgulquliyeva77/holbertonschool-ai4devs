openapi: 3.0.3
info:
  title: Inventory API
  version: 1.0.0
  description: API for managing e-commerce product inventory with full error handling and explicit pagination schema.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Product:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        sku:
          type: string
        price:
          type: number
        quantity:
          type: integer
    PaginatedProducts:
      type: object
      properties:
        total:
          type: integer
          description: Total number of products found
        page:
          type: integer
          description: Current page number
        limit:
          type: integer
          description: Items per page
        totalPages:
          type: integer
          description: Total number of pages
        data:
          type: array
          items:
            $ref: '#/components/schemas/Product'
paths:
  /products:
    get:
      summary: List and search products with pagination behavior
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            default: 10
        - in: query
          name: page
          schema:
            type: integer
            default: 1
      responses:
        '200':
          description: Successful response with full paginated metadata and data structure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedProducts'
        '401':
          description: Unauthorized - Invalid or missing token
        '500':
          description: Internal server error
    post:
      summary: Create a new product
      security:
        - bearerAuth: []
      responses:
        '201':
          description: Product successfully created
        '400':
          description: Bad Request - Invalid input data or validation failed
        '401':
          description: Unauthorized - Authentication required
        '500':
          description: Internal server error
  /products/{id}:
    get:
      summary: Get product details by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Product details found
        '400':
          description: Bad Request - Invalid ID format
        '404':
          description: Product not found
        '500':
          description: Internal server error
    put:
      summary: Update an existing product
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Product updated successfully
        '400':
          description: Bad Request - Validation error
        '401':
          description: Unauthorized
        '404':
          description: Product not found
        '500':
          description: Internal server error
    delete:
      summary: Delete a product
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Product deleted successfully
        '401':
          description: Unauthorized
        '404':
          description: Product not found
        '500':
          description: Internal server error
