openapi: 3.0.3
info:
  title: Inventory API
  version: 1.0.0
  description: API for managing e-commerce product inventory.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
paths:
  /products:
    get:
      summary: List and search products
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            default: 10
          description: Number of products to return
        - in: query
          name: page
          schema:
            type: integer
            default: 1
          description: Page number for pagination
      responses:
        '200':
          description: Successful response with list of products
        '401':
          description: Unauthorized request
    post:
      summary: Create a new product
      security:
        - bearerAuth: []
      responses:
        '201':
          description: Product successfully created
        '400':
          description: Invalid input data
  /products/{id}:
    get:
      summary: Get product details by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Product details found
        '404':
          description: Product not found
    put:
      summary: Update an existing product
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Product updated successfully
        '404':
          description: Product not found
    delete:
      summary: Delete a product
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Product deleted successfully
        '404':
          description: Product not found
